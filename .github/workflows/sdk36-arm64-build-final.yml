name: SDK 36 ARM64 build final

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      SDK_ROOT: ${{ github.workspace }}/sdk
      AAPT2_REPO: https://github.com/arriRgb31/aapt2-termux.git
      APKTOOL_VERSION: 2.11.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check configuration
        run: |
          uname -a
          printf '%s\n' "$SDK_ROOT" "$AAPT2_REPO" "$APKTOOL_VERSION"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build git curl unzip zip file \
            protobuf-compiler libprotobuf-dev libpng-dev libexpat1-dev \
            zlib1g-dev libc6-dev linux-libc-dev gcc g++ libstdc++-13-dev \
            libfmt-dev liblz4-dev libzstd-dev zipalign
      - name: Download SDK 36 inputs
        run: |
          mkdir -p "$SDK_ROOT"
          curl -fL --retry 5 --retry-all-errors -o sdk-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q sdk-tools.zip -d "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools"/bin "$SDK_ROOT/cmdline-tools"/lib \
            "$SDK_ROOT/cmdline-tools"/NOTICE.txt "$SDK_ROOT/cmdline-tools"/source.properties \
            "$SDK_ROOT/cmdline-tools/latest/"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build native AAPT2
        run: |
          git clone --depth 1 "$AAPT2_REPO" aapt2-src
          cd aapt2-src
          sed -i '1c#!/usr/bin/env bash' build.sh
          sed -i 's/find_package(Threads REQUIRED)/if(NOT TARGET Threads::Threads)\n  add_library(Threads::Threads INTERFACE IMPORTED)\nendif()\nset_target_properties(Threads::Threads PROPERTIES INTERFACE_LINK_LIBRARIES "-pthread")/' cmake/Dependencies.cmake
          sed -i '/CMAKE_C_COMPILER_TARGET/d; /CMAKE_CXX_COMPILER_TARGET/d; /-femulated-tls/d' cmake/CompilerFlags.cmake
          mkdir -p /tmp/android-headers third_party/androidfw/include
          curl -fL --retry 5 --retry-all-errors -o /tmp/android-headers/native.deb \
            https://mirrors.aliyun.com/ubuntu/pool/universe/a/android-platform-tools/android-platform-frameworks-native-headers_34.0.5-12_all.deb
          echo '1636567f75417966cc2b9a3b3bacc962b5240fbc95ec9a914d3f65558651d307  /tmp/android-headers/native.deb' | sha256sum -c -
          dpkg-deb -x /tmp/android-headers/native.deb /tmp/android-headers/native
          cp -a /tmp/android-headers/native/usr/include/android/android third_party/androidfw/include/
          sed -i '/ACONFIGURATION_COLOR_MODE = 0x10000,/a\    ACONFIGURATION_GRAMMATICAL_GENDER = 0x20000,\n    ACONFIGURATION_GRAMMATICAL_GENDER_ANY = 0,\n    ACONFIGURATION_GRAMMATICAL_GENDER_NEUTER = 1,\n    ACONFIGURATION_GRAMMATICAL_GENDER_FEMININE = 2,\n    ACONFIGURATION_GRAMMATICAL_GENDER_MASCULINE = 3,' third_party/androidfw/include/android/configuration.h
          sed -i '/#include "androidfw\/ApkParsing.h"/a#include <cstring>' third_party/androidfw/ApkParsing.cpp
          sed -i '/extern "C" int posix_strerror_r/i#ifndef __BIONIC__\nextern "C" int __xpg_strerror_r(int, char*, size_t);\n#endif' third_party/libbase/posix_strerror_r.cpp
          sed -i 's/return strerror_r(errnum, buf, buflen);/return __xpg_strerror_r(errnum, buf, buflen);/' third_party/libbase/posix_strerror_r.cpp
          sed -i -e 's/^constexpr inline uint32_t packLocale/inline uint32_t packLocale/' -e 's/^constexpr inline uint32_t packScript/inline uint32_t packScript/' third_party/androidfw/include/androidfw/LocaleDataLookup.h
          sed -i '/const const_iterator operator++(int)/i\
        const_iterator& operator--() { safe_ptr_ += -1; return *this; }\
        const_iterator operator--(int) { const_iterator temp(*this); safe_ptr_ += -1; return temp; }\
' third_party/incfs/util/include/util/map_ptr.h
          CC=clang CXX='clang++ -stdlib=libstdc++ -include cstring' ./build.sh
          file build/aapt2
          ./build/aapt2 version
          install -Dm755 build/aapt2 "$GITHUB_WORKSPACE/package/aapt2"
      - name: Verify SDK 36 resources
        run: |
          set -eux
          AAPT2="$GITHUB_WORKSPACE/package/aapt2"
          PLATFORM="$SDK_ROOT/platforms/android-36/android.jar"
          "$AAPT2" dump badging "$PLATFORM" >/dev/null
          mkdir -p verify/res/values verify/out
          printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.sdk36test"><application android:theme="@style/AppTheme" /></manifest>' > verify/AndroidManifest.xml
          printf '%s\n' '<resources><style name="AppTheme" parent="android:style/Theme.Material.Light" /></resources>' > verify/res/values/styles.xml
          "$AAPT2" compile --dir verify/res -o verify/out/res.zip
          "$AAPT2" link --proto-format -o verify/out/resources.pb -I "$PLATFORM" --manifest verify/AndroidManifest.xml verify/out/res.zip
      - name: Package tools
        run: |
          set -eux
          mkdir -p package/sdk36
          cp /usr/bin/zipalign package/sdk36/
          cp "$SDK_ROOT/build-tools/36.0.0/apksigner" package/sdk36/
          cp "$SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" package/sdk36/ || true
          cp "$GITHUB_WORKSPACE/package/aapt2" package/sdk36/
          curl -fL --retry 5 --retry-all-errors -o package/sdk36/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          printf '%s\n' 'SDK 36 ARM64 Ubuntu tool bundle' > package/sdk36/README.txt
          zip -q -r sdk36-arm64-ubuntu-tools.zip package/sdk36
          sha256sum sdk36-arm64-ubuntu-tools.zip > sdk36-arm64-ubuntu-tools.zip.sha256
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: sdk36-arm64-ubuntu-tools
          path: |
            sdk36-arm64-ubuntu-tools.zip
            sdk36-arm64-ubuntu-tools.zip.sha256
